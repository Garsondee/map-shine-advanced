<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Critter lab</title>
    <style>
      body {
        background: #111;
        color: #ccc;
        font: 12px monospace;
        margin: 8px;
      }
      #wrap {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      canvas {
        display: block;
        background: #000;
        cursor: crosshair;
        max-width: 100%;
      }
      #panel {
        width: 300px;
        flex: none;
      }
      #panel h4 {
        margin: 10px 0 4px;
        color: #9c9;
      }
      #panel label {
        display: grid;
        grid-template-columns: 120px 1fr 44px;
        gap: 4px;
        align-items: center;
        margin: 2px 0;
      }
      #panel select,
      #panel button {
        font: inherit;
      }
      pre {
        white-space: pre-wrap;
        max-height: 220px;
        overflow: auto;
        margin: 6px 0 0;
      }
    </style>
  </head>
  <body>
    <div>
      Critter lab: <code>window.critterLab</code> — paint a zone with the mouse (shift erases) and watch flies, maggots
      and fireflies live in it. Renders the REAL <code>src/</code> subsystems on a real WebGPU device.
    </div>
    <div id="wrap">
      <canvas id="view" width="1280" height="720"></canvas>
      <div id="panel"></div>
    </div>
    <pre id="status">loading…</pre>
    <script type="module" src="/tools/shader-lab/critter-lab.js"></script>
  </body>
</html>
