<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fluid lab</title>
    <style>
      body {
        background: #111;
        color: #ccc;
        font: 12px monospace;
        margin: 8px;
      }
      #wrap {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      canvas {
        display: block;
        background: #000;
      }
      #panel {
        width: 360px;
        flex: none;
        max-height: 900px;
        overflow-y: auto;
      }
      #panel h4 {
        margin: 10px 0 4px;
        color: #9c9;
      }
      #panel label {
        display: grid;
        grid-template-columns: 130px 1fr 52px;
        gap: 4px;
        align-items: center;
        margin: 2px 0;
      }
      #panel button {
        font: inherit;
        margin: 2px 2px 2px 0;
      }
      pre {
        white-space: pre-wrap;
        max-height: 240px;
        overflow: auto;
        margin: 6px 0 0;
      }
    </style>
  </head>
  <body>
    <div>
      Fluid lab: <code>window.fluidLab</code> — the REAL fluid subsystem (<code>fluid-surface-subsystem.js</code>: tube
      net, pack, pump, sim, materials) on Wizard's Lair's <code>_Glassware_Fluid</code>, lit and bloomed like the
      viewer.
    </div>
    <div id="wrap">
      <canvas id="view" width="1600" height="900"></canvas>
      <div id="panel"></div>
    </div>
    <pre id="status">loading…</pre>
    <script type="module" src="/tools/shader-lab/fluid-lab.js"></script>
  </body>
</html>
