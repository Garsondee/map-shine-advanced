<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Table lab</title>
    <style>
      body {
        background: #111;
        color: #ccc;
        font: 12px monospace;
        margin: 8px;
      }
      #wrap {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      canvas {
        display: block;
        background: #000;
        max-width: 100%;
        cursor: grab;
      }
      #panel {
        width: 340px;
        flex: none;
        max-height: 720px;
        overflow-y: auto;
      }
      #panel h4 {
        margin: 10px 0 4px;
        color: #9cc;
      }
      #panel label {
        display: grid;
        grid-template-columns: 120px 1fr 44px;
        gap: 4px;
        align-items: center;
        margin: 2px 0;
      }
      pre {
        white-space: pre-wrap;
        max-height: 220px;
        overflow: auto;
        margin: 6px 0 0;
      }
    </style>
  </head>
  <body>
    <div>
      Table lab: <code>window.tableLab</code> — the REAL Table surface (<code>table-render.js</code>) round a map in a
      padded Foundry-style canvas. Drag to pan, wheel to zoom: the rim, walls and velvet move with the pretend eye.
    </div>
    <div id="wrap">
      <canvas id="view" width="1280" height="720"></canvas>
      <div id="panel"></div>
    </div>
    <pre id="status">loading…</pre>
    <script type="module" src="/tools/shader-lab/table-lab.js"></script>
  </body>
</html>
