<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Wind lab</title>
    <style>
      body {
        background: #111;
        color: #ccc;
        font: 12px monospace;
        margin: 8px;
      }
      #wrap {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      canvas {
        display: block;
        background: #000;
        max-width: 100%;
      }
      #panel {
        width: 320px;
        flex: none;
      }
      #panel h4 {
        margin: 10px 0 4px;
        color: #9c9;
      }
      #panel label {
        display: grid;
        grid-template-columns: 110px 1fr 54px;
        gap: 4px;
        align-items: center;
        margin: 2px 0;
      }
      pre {
        white-space: pre-wrap;
        margin: 6px 0 0;
      }
    </style>
  </head>
  <body>
    <div>
      Wind lab: <code>window.windLab</code> — the REAL wind field (<code>world/wind-field.js</code> via the handle), the
      REAL overlay materials, and the REAL Wind Trails engine, on an open 100 px / 5 ft grid.
    </div>
    <div id="wrap">
      <canvas id="view" width="1280" height="720"></canvas>
      <div id="panel"></div>
    </div>
    <pre id="status">loading…</pre>
    <script type="module" src="/tools/shader-lab/wind-lab.js"></script>
  </body>
</html>
