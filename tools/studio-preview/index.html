<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Studio Preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font:
          13px/1.5 system-ui,
          sans-serif;
        /* Token-driven, not hardcoded to dark — preview.js's own "Cycle
           theme" button flips html[data-theme], and LANTERN's tokens (once
           installTokens() injects them) update --bg0/--ink0 live. Before
           this, the harness page around the glass room stayed hardcoded to
           dark's exact colours no matter which theme was selected, which
           made e.g. light-theme card text (dark ink on a light card, but
           still sitting in this body's old near-black background/native
           ink) look broken when the room itself was rendering correctly. */
        background: var(--bg0, #14161d);
        color: var(--ink0, #eceff5);
      }
      #bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 500;
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        background: #191c25;
        border-bottom: 1px solid #333;
      }
      #bar button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <b>Studio Preview</b>
      <button id="toggleBtn" type="button">Toggle Studio</button>
      <button id="playerBtn" type="button">Toggle Player</button>
      <button id="themeBtn" type="button">Cycle theme</button>
      <span id="log" style="margin-left: 12px; opacity: 0.7"></span>
      <span id="weatherReadout" style="margin-left: 12px; opacity: 0.7"></span>
    </div>
    <script type="module" src="/tools/studio-preview/preview.js"></script>
  </body>
</html>
