<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Widget Gallery — LANTERN</title>
    <style>
      /* Page chrome only. Every WIDGET below is styled by the real
         src/ui/tokens.js stylesheet, installed live by gallery.js — nothing
         about a control's own appearance is duplicated here. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font:
          13px/1.5 system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid #8884;
        flex: none;
      }
      #bar b {
        margin-right: 8px;
      }
      #bar button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
      }
      #bar button[aria-pressed='true'] {
        font-weight: 700;
        text-decoration: underline;
      }
      #contrastLine {
        margin-left: auto;
        font-family: monospace;
        font-size: 12px;
      }
      main {
        flex: 1;
        overflow: auto;
        padding: 20px;
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        align-content: start;
      }
      section {
        border: 1px solid #8884;
        border-radius: 8px;
        padding: 12px;
      }
      section h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 0 0 8px;
        opacity: 0.7;
      }
      #icons {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
        gap: 8px;
      }
      #icons .iconCell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 9px;
        text-align: center;
        opacity: 0.75;
      }
      #icons svg {
        width: 22px;
        height: 22px;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <b>LANTERN widget gallery</b>
      <span id="themeButtons"></span>
      <span id="contrastLine"></span>
    </div>
    <main>
      <section id="widgetsHost"><h2>Param controls (buildParamControl)</h2></section>
      <section id="plannedHost"><h2>status: 'planned' (control-readiness convention)</h2></section>
      <section id="inheritHost"><h2>buildInheritableRangeRow</h2></section>
      <section id="icons"><h2 style="grid-column: 1 / -1">Icon sprite</h2></section>
    </main>
    <script type="module" src="/tools/widget-gallery/gallery.js"></script>
  </body>
</html>
